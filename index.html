<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.B. - Data Analysis Assistant</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <script type="importmap">
{
  "imports": {
    "marked": "https://esm.sh/marked@^15.0.8",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.22.0",
    "express": "https://aistudiocdn.com/express@^5.1.0",
    "dotenv/": "https://aistudiocdn.com/dotenv@^17.2.3/"
  }
}
</script>
  <script type="module" src="index.tsx"></script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="app-container">
    <aside id="chat-panel">
      <header>
        <h1>J.B.</h1>
      </header>
      <div id="chat-history"></div>
      <footer id="chat-input-container">
        <form id="chat-form">
          <button type="button" id="upload-btn" aria-label="Upload file" title="Upload file">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          </button>
          <input type="text" id="chat-input" placeholder="Ask J.B. about your data..." autocomplete="off">
          <button type="submit" id="send-btn" aria-label="Send message" title="Send message">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
      </footer>
    </aside>
    <main id="main-content">
      <div id="data-view" class="placeholder">
        <h2>Data Viewer</h2>
        <p>Your data analysis and reports will appear here.</p>
      </div>
    </main>
  </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
